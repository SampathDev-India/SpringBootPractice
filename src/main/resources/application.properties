spring.application.name=SpringBoot-Practice

spring.datasource.url=jdbc:mysql://localhost:3306/sampath
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=redis

# Redis cache TTL: 10 minutes
spring.cache.redis.time-to-live=10m

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.show-actuator=true
springdoc.enable-spring-security=false
springdoc.model-name-generator=io.swagger.v3.core.util.DefaultSchemaNamingStrategy
springdoc.use-root-path=true

# Actuator endpoints for health monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
